# Recopie chaque heure le modèle du mail et les signalements d'erreur du dashboard dans config/,
# que la routine lit dans son clone du dépôt (le réseau de la routine n'atteint pas le dashboard).
name: Copie du modèle du mail
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: modele
jobs:
  copier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Copier le modèle et les signalements s'ils ont changé
        run: |
          mkdir -p config
          for nom in modele signalement; do
            curl -fsS --retry 3 "https://le-coffre-patrimoine.vercel.app/api/$nom" -o "/tmp/$nom.json"
            python3 -c "import json, sys; json.load(open(sys.argv[1]))" "/tmp/$nom.json"
          done
          cp /tmp/modele.json config/modele.json
          cp /tmp/signalement.json config/signalements.json
          git add config/modele.json config/signalements.json
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Copie du modèle du mail et des signalements du dashboard"
          git push
