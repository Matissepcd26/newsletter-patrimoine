# Recopie chaque heure le modèle du mail réglé sur le dashboard dans config/modele.json,
# que la routine lit dans son clone du dépôt (le réseau de la routine n'atteint pas le dashboard).
name: Copie du modèle du mail
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: modele
jobs:
  copier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Copier le modèle s'il a changé
        run: |
          curl -fsS --retry 3 https://le-coffre-patrimoine.vercel.app/api/modele -o /tmp/modele.json
          python3 -c "import json; m = json.load(open('/tmp/modele.json')); assert 'style' in m and 'contenu' in m"
          mkdir -p config
          if cmp -s /tmp/modele.json config/modele.json; then echo "Modèle inchangé"; exit 0; fi
          cp /tmp/modele.json config/modele.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/modele.json
          git commit -m "Modèle du mail : copie du réglage du dashboard"
          git push
